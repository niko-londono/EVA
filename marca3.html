<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA | GUCCI</title>
    <link rel="icon" type="image/png" href="assets/venus.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Observer.min.js"></script>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <nav class="navbar">
        <a href="index.html" class="logo">EVA</a>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#slide-1">Inicio</a></li>
            <li><a href="index.html#slide-2" class="active">Trabajos</a></li>
            <li><a href="index.html#slide-3">Info</a></li>
            <li><a href="javascript:history.back()" style="color: var(--accent);">← Volver</a></li>
        </ul>
        <div class="nav-contact">
            <a href="mailto:hola@eva.com">Contacto</a>
        </div>
    </nav>

    <div class="dot-nav">
        <div class="dot active" data-slide="0"></div>
        <div class="dot" data-slide="1"></div>
    </div>

    <main class="slider-container">
        <!-- Hero Slide -->
        <section class="slide" id="slide-1">
            <div class="parallax-scene">
                <div class="layer bg-layer" data-depth="0.1" style="background-color: var(--bg-primary);"></div>
                <div class="deco-dot" style="top: 18%; left: 12%;"></div>
                <div class="layer content-layer" data-depth="0.3">
                    <div class="slide-content">
                        <p class="subtitle" style="margin-bottom: 15px;">Colección Primavera</p>
                        <h2 class="huge-title">GUCCI</h2>
                        <p style="margin-top: 25px; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted);">Scroll para ver la galería</p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Gallery Slide -->
        <section class="slide" id="slide-2">
            <div class="parallax-scene">
                <div class="layer bg-layer" data-depth="0.1" style="background-color: #111;"></div>
                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content" style="margin-top: 10vh;">
                        <div class="gallery-grid">
                            <img src="https://picsum.photos/seed/gucci1/800/1200" class="gallery-item" alt="GUCCI Image 1">
                            <img src="https://picsum.photos/seed/gucci2/800/1200" class="gallery-item" alt="GUCCI Image 2">
                            <img src="https://picsum.photos/seed/gucci3/800/1200" class="gallery-item" alt="GUCCI Image 3">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-left">© 2026 EVA. All Rights Reserved.</div>
        <div class="footer-center">E V A</div>
        <div class="footer-right">
            <a href="#">Instagram</a>
            <a href="#">Vimeo</a>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
