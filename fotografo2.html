<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA | ANNIE LEIBOVITZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Observer.min.js"></script>
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 80vw;
            max-width: 1200px;
            pointer-events: auto;
        }
        .gallery-item {
            width: 100%;
            height: 40vh;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.4s ease;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                height: 60vh;
                overflow-y: auto;
                padding-right: 10px;
            }
            .gallery-item { height: 30vh; margin-bottom: 20px; }
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">EVA</a>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#slide-1">Inicio</a></li>
            <li><a href="index.html#slide-2">Obras</a></li>
            <li><a href="index.html#slide-3">Sobre Mí</a></li>
            <li><a href="menu-trabajos.html" style="color: var(--accent-color);">← Volver</a></li>
        </ul>
    </nav>

    <main class="slider-container">
        <!-- Hero Slide -->
        <section class="slide" id="slide-1">
            <div class="parallax-scene">
                <div class="layer bg-layer" data-depth="0.1" style="background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);"></div>
                <div class="layer content-layer" data-depth="0.3">
                    <div class="slide-content">
                        <h2 class="huge-title">ANNIE LEIBOVITZ</h2>
                        <p class="subtitle">Retratos Célebres</p>
                        <p style="margin-top:20px; font-size:1.2rem; opacity:0.8;">Haz scroll hacia abajo para ver la galería</p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Gallery Slide -->
        <section class="slide" id="slide-2">
            <div class="parallax-scene">
                <div class="layer bg-layer" data-depth="0.1" style="background-color: #111;"></div>
                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content" style="margin-top: 10vh;">
                        <div class="gallery-grid">
                            <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=800" class="gallery-item" alt="ANNIE LEIBOVITZ Image 1">
                            <img src="https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?w=800" class="gallery-item" alt="ANNIE LEIBOVITZ Image 2">
                            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=800" class="gallery-item" alt="ANNIE LEIBOVITZ Image 3">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="assets/js/main.js"></script>
</body>
</html>
