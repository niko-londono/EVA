<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA | Experiencia y Promociones</title>
    <link rel="icon" type="image/png" href="assets/venus.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Thick Sans-serif for Impact, clean Sans for body -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Observer.min.js"></script>
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Navigation Overlay -->
    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">EVA</a>
        <ul class="nav-links">
            <li><a href="#slide-1">Fotógrafos</a></li>
            <li><a href="#slide-2">Promociones</a></li>
        </ul>
    </nav>

    <!-- Scroll Snapping Container -->
    <main class="slider-container">
        
        <!-- SLIDE 1: FOTOGRAFOS -->
        <section class="slide" id="slide-1">
            <div class="parallax-scene">
                <!-- Pastel background -->
                <div class="layer bg-layer" data-depth="0.1" style="background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);"></div>
                
                <div class="layer content-layer" data-depth="0.3">
                    <div class="slide-content align-left">
                        <h2 class="huge-title">MARIO<br>TESTINO</h2>
                        <p class="subtitle">Sesión Editorial 2025</p>
                    </div>
                </div>
                
                <!-- Floating Artwork -->
                <div class="layer fg-layer" data-depth="0.6">
                    <img src="https://picsum.photos/seed/experiencia2318/800/1200" alt="Sesión Fotógrafo" class="floating-img" style="border-radius: 20px; width: 35vw; height: 60vh; object-fit: cover; position: absolute; top: 20%; right: 10%; box-shadow: 0 40px 80px rgba(0,0,0,0.2);">
                </div>
            </div>
        </section>

        <!-- SLIDE 2: PROMOCIONES -->
        <section class="slide" id="slide-2">
            <div class="parallax-scene">
                <!-- Pastel background -->
                <div class="layer bg-layer" data-depth="0.15" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);"></div>
                
                <div class="layer fg-layer" data-depth="0.5">
                    <img src="https://picsum.photos/seed/experiencia3106/800/1200" alt="Promociones Marcas" class="floating-img" style="border-radius: 10px; width: 40vw; height: 50vh; object-fit: cover; position: absolute; bottom: 15%; left: 10%; box-shadow: 0 30px 60px rgba(255, 154, 158, 0.4);">
                </div>

                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content align-right" style="position: absolute; right: 10%; top: 30%; max-width: 500px; text-align: left;">
                        <h2 class="huge-title" style="font-size: 5rem;">PROMO<br>CIONES</h2>
                        <p class="subtitle" style="color: #333; margin-top: 20px; line-height: 1.8; text-transform: none; letter-spacing: 0;">Colaboraciones exclusivas con marcas internacionales. Descubre las últimas campañas de EVA.</p>
                        <a href="#" class="btn btn-solid" style="margin-top: 30px;">Ver Marcas</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
</body>
</html>
