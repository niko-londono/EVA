<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA | Director / Artist / Visualizer</title>
    <link rel="icon" type="image/png" href="assets/venus.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Observer.min.js"></script>
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="logo">EVA</a>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#slide-1" class="active">Inicio</a></li>
            <li><a href="index.html#slide-2">Trabajos</a></li>
            <li><a href="index.html#slide-3">Info</a></li>
        </ul>
        <div class="nav-contact">
            <a href="mailto:hola@eva.com">Contacto</a>
        </div>
    </nav>

    <!-- Dot Navigation -->
    <div class="dot-nav">
        <div class="dot active" data-slide="0"></div>
        <div class="dot" data-slide="1"></div>
        <div class="dot" data-slide="2"></div>
    </div>

    <!-- Scroll Hint -->
    <div class="scroll-hint">Scroll para explorar</div>

    <!-- Slider Container -->
    <main class="slider-container">
        
        <!-- SLIDE 1: HERO -->
        <section class="slide" id="slide-1">
            <div class="parallax-scene">
                <!-- Dark background -->
                <div class="layer bg-layer" data-depth="0.1" style="background-color: var(--bg-primary);"></div>
                
                <!-- Decorative dots -->
                <div class="deco-dot" style="top: 15%; left: 18%;"></div>
                
                <!-- Polaroid Left -->
                <div class="layer" data-depth="0.5" style="pointer-events: none;">
                    <div class="polaroid" style="left: 8%; top: 18%; transform: rotate(-8deg); width: 220px;">
                        <img src="https://images.unsplash.com/photo-1495745966610-2a67f2297e5e?w=400&q=80" alt="Scene 01">
                        <div class="caption">Scene 01 - Take 4</div>
                    </div>
                </div>
                
                <!-- Content Layer -->
                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content">
                        <h1 class="huge-title">EVA</h1>
                        <p class="subtitle">Director / Artist / Visualizer</p>
                        <a href="menu-trabajos.html" class="btn btn-accent" style="margin-top: 35px;">
                            <span>▶</span> Ver Trabajos
                        </a>
                    </div>
                </div>
                
                <!-- Polaroid Right -->
                <div class="layer" data-depth="0.6" style="pointer-events: none;">
                    <div class="polaroid" style="right: 8%; top: 22%; transform: rotate(5deg); width: 200px;">
                        <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80" alt="Location Scout">
                        <div class="caption">Location Scout</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SLIDE 2: TRABAJOS -->
        <section class="slide" id="slide-2">
            <div class="parallax-scene">
                <div class="layer bg-layer" data-depth="0.1" style="background-color: var(--bg-primary);"></div>
                
                <div class="deco-dot" style="top: 20%; left: 12%;"></div>
                
                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content">
                        <!-- Circular Viewport -->
                        <div class="circle-viewport">
                            <div class="film-card" style="left: 10%; top: 20%;">
                                <img src="https://images.unsplash.com/photo-1518676590747-1e3dcf5a1e32?w=600&q=80" alt="Urban Echoes">
                                <div class="card-title">Fotógrafos</div>
                                <div class="card-meta">Sesiones Exclusivas</div>
                            </div>
                            <div class="film-card" style="right: -5%; top: 15%; width: 35%;">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80" alt="A Late Bloom">
                                <div class="card-title" style="text-align: right;">Marcas</div>
                            </div>
                        </div>
                        <a href="menu-trabajos.html" class="btn btn-outline" style="margin-top: 30px;">Explorar Colección</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- SLIDE 3: INFO -->
        <section class="slide" id="slide-3">
            <div class="parallax-scene">
                <div class="layer bg-layer" data-depth="0.1" style="background-color: var(--bg-primary);"></div>
                
                <!-- Moody background photo -->
                <div class="layer" data-depth="0.15">
                    <div class="info-bg" style="background-image: url('https://images.unsplash.com/photo-1585907835165-e71eea51cf63?w=1600&q=80');"></div>
                </div>
                
                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content">
                        <div class="info-content">
                            <p class="directed-by">Directed by</p>
                            <h2 class="brand-name">EVA Films</h2>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-left">© 2026 EVA. All Rights Reserved.</div>
        <div class="footer-center">E V A</div>
        <div class="footer-right">
            <a href="#">Instagram</a>
            <a href="#">Vimeo</a>
            <a href="#">Resume</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
</body>
</html>
