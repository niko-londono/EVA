<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA | Artistic Parallax</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Thick Sans-serif for Impact, clean Sans for body -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Observer.min.js"></script>
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Navigation Overlay -->
    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">EVA</a>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#slide-1">Inicio</a></li>
            <li><a href="index.html#slide-2">Obras</a></li>
            <li><a href="index.html#slide-3">Sobre Mí</a></li>
        </ul>
    </nav>

    <!-- Scroll Snapping Container -->
    <main class="slider-container">
        
        <!-- SLIDE 1: HERO -->
        <section class="slide" id="slide-1">
            <div class="parallax-scene">
                <!-- Background (moves least) -->
                <div class="layer bg-layer" data-depth="0.1" style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=2000&q=80'); filter: blur(2px);"></div>
                
                <!-- Midground Layer -->
                <div class="layer mid-layer" data-depth="0.4" style="background-image: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=1200&q=80'); opacity: 0.6; mix-blend-mode: overlay;"></div>
                
                <!-- Content Layer -->
                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content">
                        <h1 class="huge-title">EVA</h1>
                        <p class="subtitle" style="color: #a0a0a0;">Conoce quién es EVA</p>
                    </div>
                </div>
                
                <!-- Foreground Element (moves most) -->
                <div class="layer fg-layer" data-depth="0.8">
                    <!-- Abstract organic shape -->
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80" alt="Abstract Shape" class="floating-img organic-blob" style="width: 30vw; height: 30vw; object-fit: cover; bottom: 10%; right: 10%;">
                </div>
            </div>
        </section>

        <!-- SLIDE 2: GALLERY/WORKS -->
        <section class="slide" id="slide-2">
            <div class="parallax-scene">
                <!-- Pastel background -->
                <div class="layer bg-layer" data-depth="0.1" style="background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);"></div>
                
                <div class="layer content-layer" data-depth="0.3">
                    <div class="slide-content align-left">
                        <h2 class="huge-title">TRABAJOS</h2>
                        <p class="subtitle">Colección 2026</p>
                        <a href="menu-trabajos.html" class="btn btn-glass">Ver Galería Completa</a>
                    </div>
                </div>
                
                <!-- Floating Artwork -->
                <div class="layer fg-layer" data-depth="0.6">
                    <img src="https://images.unsplash.com/photo-1547826039-bfc35e0f1ea8?auto=format&fit=crop&w=800&q=80" alt="Sueños Art" class="floating-img" style="border-radius: 20px; width: 40vw; height: 50vh; object-fit: cover; position: absolute; top: 25%; right: 15%; box-shadow: 0 40px 80px rgba(0,0,0,0.2);">
                </div>
            </div>
        </section>

        <!-- SLIDE 3: ABOUT / CONTACT -->
        <section class="slide" id="slide-3">
            <div class="parallax-scene">
                <!-- Pastel background -->
                <div class="layer bg-layer" data-depth="0.15" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);"></div>
                
                <div class="layer fg-layer" data-depth="0.5">
                    <img src="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?auto=format&fit=crop&w=800&q=80" alt="Eva" class="floating-img" style="border-radius: 10px; width: 35vw; height: 60vh; object-fit: cover; position: absolute; bottom: 10%; left: 10%; box-shadow: 0 30px 60px rgba(252, 182, 159, 0.4);">
                </div>

                <div class="layer content-layer" data-depth="0.2">
                    <div class="slide-content align-right" style="position: absolute; right: 10%; top: 30%; max-width: 500px; text-align: left;">
                        <h2 class="huge-title" style="font-size: 5rem;">LA<br>ARTISTA</h2>
                        <p class="subtitle" style="color: #333; margin-top: 20px; line-height: 1.8; text-transform: none; letter-spacing: 0;">Exploro las emociones a través del color y texturas oníricas. Cada lienzo es una ventana a un mundo paralelo.</p>
                        <a href="mailto:hola@eva.com" class="btn btn-solid" style="margin-top: 30px;">Hablemos</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
</body>
</html>
